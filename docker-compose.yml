services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: fraud-api

    ports:
      - "8000:8000"

    restart: unless-stopped


  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard

    container_name: fraud-dashboard

    environment:
      API_BASE_URL: http://api:8000

    ports:
      - "8501:8501"

    depends_on:
      - api

    restart: unless-stopped
